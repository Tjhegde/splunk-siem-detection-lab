
title: Encoded PowerShell Execution
status: experimental
description: Detects PowerShell processes launched with encoded-command arguments using Windows Security process creation events.
author: SIEM Lab
date: 2026-10-31
logsource:
  product: windows
  service: security
  definition: Process creation auditing and command-line capture must be enabled.
detection:
  selection_event:
    EventID: 4688
  selection_process:
    NewProcessName|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_command:
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
  condition: selection_event and selection_process and selection_command
fields:
  - NewProcessName
  - CommandLine
  - ParentProcessName
  - SubjectUserName
falsepositives:
  - Legitimate administrative scripts
  - Endpoint management automation
level: medium
